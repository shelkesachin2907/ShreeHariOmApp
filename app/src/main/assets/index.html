<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री Hari Om Enterprises - AC & Maintenance Services</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-start p-0 m-0">

<!-- Top Viewport Mode Switcher for Testing -->
<header class="w-full bg-slate-950 border-b border-slate-800 py-2 px-4 flex justify-between items-center text-xs text-slate-400 z-50">
    <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-semibold text-slate-200">श्री Hari Om Enterprises</span> - App & Web Studio
    </div>
    <div class="flex items-center gap-2">
        <button onclick="setMode('mobile')" id="btnMobile" class="px-3 py-1 rounded bg-amber-500 text-slate-950 font-medium transition">Mobile View</button>
        <button onclick="setMode('desktop')" id="btnDesktop" class="px-3 py-1 rounded bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition">Desktop Web</button>
    </div>
</header>

<!-- Main Container Wrapper -->
<div id="appContainer" class="w-full max-w-md bg-slate-900 shadow-2xl flex flex-col relative overflow-hidden transition-all duration-300 min-h-[92vh] border-x border-slate-800">

    <!-- Top Header & Branding -->
    <header class="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border-b border-amber-500/30 sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="flex items-center justify-between">
            <!-- Back Button (conditional) & Logo Badge -->
            <div class="flex items-center gap-3">
                <button id="backBtn" onclick="goBack()" class="hidden text-amber-400 hover:text-amber-300 transition p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                </button>
                <!-- Official SVG Logo Badge -->
                <div class="flex items-center gap-2.5">
                    <div class="w-11 h-11 rounded-full bg-slate-950 border-2 border-amber-500 flex items-center justify-center p-0.5 shadow-md shadow-amber-500/20 shrink-0">
                        <svg viewBox="0 0 100 100" class="w-full h-full rounded-full">
                            <circle cx="50" cy="50" r="48" fill="#111827"/>
                            <!-- Shivling Black Dome -->
                            <path d="M35 65 C35 30, 65 30, 65 65 Z" fill="#000000" stroke="#d97706" stroke-width="2"/>
                            <!-- Tripundra (White lines + Red Tilak) -->
                            <rect x="42" y="40" width="16" height="2.5" fill="#ffffff" rx="1"/>
                            <rect x="42" y="45" width="16" height="2.5" fill="#ffffff" rx="1"/>
                            <rect x="42" y="50" width="16" height="2.5" fill="#ffffff" rx="1"/>
                            <circle cx="50" cy="46" r="2" fill="#ef4444"/>
                            <!-- Marathi Shree -->
                            <text x="50" y="60" font-size="14" fill="#ef4444" font-weight="bold" text-anchor="middle">श्री</text>
                            <!-- HariOm Text -->
                            <text x="50" y="74" font-size="10" fill="#fbbf24" font-weight="bold" text-anchor="middle">HariOm</text>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold text-amber-400 tracking-wide leading-tight">श्री Hari Om Ent.</h1>
                        <p class="text-[10px] text-slate-300 tracking-wider">AC Maintenance & CCTV</p>
                    </div>
                </div>
            </div>

            <!-- Contact & Emergency Actions -->
            <div class="flex items-center gap-2">
                <a href="tel:7710817224" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-full shadow transition" title="Call Now">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                </a>
            </div>
        </div>

        <!-- Global Search & Filter Bar -->
        <div class="mt-2.5 relative">
            <input type="text" id="globalSearch" oninput="handleSearch(this.value)" placeholder="Search services, AC models, AMC, bills..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-8 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
            <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-200 text-xs">✕</button>
        </div>
    </header>

    <!-- Dynamic Body Content Viewport -->
    <main id="mainContent" class="flex-1 overflow-y-auto pb-24 p-4 space-y-4">
        <!-- Dynamically populated via JS -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 py-2 px-3 flex justify-around items-center z-40 shadow-lg">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-0.5 text-amber-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchTab('services')" id="nav-services" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
            <span class="text-[10px] font-medium">Services</span>
        </button>
        <button onclick="switchTab('shop')" id="nav-shop" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <span class="text-[10px] font-medium">Buy/Rent</span>
        </button>
        <button onclick="switchTab('amc')" id="nav-amc" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            <span class="text-[10px] font-medium">AMC</span>
        </button>
        <button onclick="switchTab('billing')" id="nav-billing" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            <span class="text-[10px] font-medium">Billing</span>
        </button>
    </nav>
</div>

<!-- Modals Overlay Container -->
<div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modalContent" class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 relative shadow-2xl max-h-[90vh] overflow-y-auto">
        <!-- Modal content injected dynamically -->
    </div>
</div>

<!-- JavaScript Application Core -->
<script>
    // State Management
    let currentTab = 'home';
    let navigationHistory = ['home'];
    let searchQuery = '';
    let selectedFilter = 'all';

    // Mock Database of Products & Services
    const servicesList = [
        { id: 'srv1', title: 'Jet Power AC Servicing', desc: 'Deep indoor & outdoor chemical pressure wash, filter & coil cleaning.', price: '₹499', category: 'maintenance', icon: '❄️' },
        { id: 'srv2', title: 'AC Gas Top-Up / Refill', desc: 'R32 / R410A / R22 eco-friendly gas top-up with leak test guarantee.', price: '₹1,499', category: 'repair', icon: '⚡' },
        { id: 'srv3', title: 'New AC Installation', desc: 'Professional copper piping connection, wall stand & stabilization setup.', price: '₹799', category: 'installation', icon: '🛠️' },
        { id: 'srv4', title: 'AC Uninstallation', desc: 'Safe gas pumping back, unmounting indoor & outdoor units safely.', price: '₹499', category: 'installation', icon: '📦' },
        { id: 'srv5', title: 'PCB Repair & Electrical Check', desc: 'Diagnosing sensor errors, remote issues, compressor wiring & circuit boards.', price: '₹399', category: 'repair', icon: '🔧' }
    ];

    const shopInventory = [
        { id: 'sh1', name: 'Voltas 1.5 Ton 3-Star Inverter Split AC', type: 'new', ton: '1.5', price: '₹36,999', rentPrice: '₹1,199/mo', desc: 'Brand new with 5 Year Compressor Warranty & Free Standard Installation.', imageBadge: 'NEW' },
        { id: 'sh2', name: 'Daikin 1.0 Ton 5-Star Split AC (Refurbished)', type: 'used', ton: '1.0', price: '₹18,500', rentPrice: '₹899/mo', desc: 'Certified pre-owned, fully serviced with copper condenser & 6-month warranty.', imageBadge: 'SECOND HAND' },
        { id: 'sh3', name: 'LG 1.5 Ton Window AC', type: 'new', ton: '1.5', price: '₹27,500', rentPrice: '₹999/mo', desc: 'Robust cooling performance, energy saver mode, easy window fitment.', imageBadge: 'NEW' },
        { id: 'sh4', name: 'Blue Star 2.0 Ton Heavy Duty Split AC', type: 'used', ton: '2.0', price: '₹22,000', rentPrice: '₹1,499/mo', desc: 'Ideal for large living rooms and offices. Tested and certified.', imageBadge: 'SECOND HAND' }
    ];

    const amcPlans = [
        { id: 'amc1', name: 'Basic Care AMC', price: '₹1,999 / year', visits: '2 Preventive Services', cover: 'Gas Check, Filter Cleaning, Electrical Safety', badge: 'POPULAR' },
        { id: 'amc2', name: 'Comprehensive Shield AMC', price: '₹3,499 / year', visits: '3 Services + Unlimited Breakdowns', cover: 'Includes Spare Parts Replacement (Capacitor, Fan Motor, Sensors)', badge: 'BEST VALUE' },
        { id: 'amc3', name: 'Commercial Multi-Split AMC', price: 'Custom Quote', visits: 'Monthly Scheduled Maintenance', cover: 'Priority Support for Offices, Shops & Restaurants', badge: 'ENTERPRISE' }
    ];

    // Layout Viewport Mode Switcher
    function setMode(mode) {
        const container = document.getElementById('appContainer');
        const btnMob = document.getElementById('btnMobile');
        const btnDesk = document.getElementById('btnDesktop');
        if(mode === 'desktop') {
            container.classList.remove('max-w-md', 'min-h-[92vh]', 'border-x');
            container.classList.add('max-w-5xl', 'min-h-screen');
            btnDesk.className = "px-3 py-1 rounded bg-amber-500 text-slate-950 font-medium transition";
            btnMob.className = "px-3 py-1 rounded bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition";
        } else {
            container.classList.remove('max-w-5xl', 'min-h-screen');
            container.classList.add('max-w-md', 'min-h-[92vh]', 'border-x');
            btnMob.className = "px-3 py-1 rounded bg-amber-500 text-slate-950 font-medium transition";
            btnDesk.className = "px-3 py-1 rounded bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 transition";
        }
    }

    // Navigation Tabs Controller
    function switchTab(tab, pushHistory = true) {
        currentTab = tab;
        if (pushHistory && navigationHistory[navigationHistory.length - 1] !== tab) {
            navigationHistory.push(tab);
        }
        updateNavBarUI();
        renderContent();
        updateBackBtnUI();
    }

    function goBack() {
        if (navigationHistory.length > 1) {
            navigationHistory.pop();
            const prevTab = navigationHistory[navigationHistory.length - 1];
            currentTab = prevTab;
            updateNavBarUI();
            renderContent();
            updateBackBtnUI();
        }
    }

    function updateBackBtnUI() {
        const btn = document.getElementById('backBtn');
        if (navigationHistory.length > 1) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    }

    function updateNavBarUI() {
        ['home', 'services', 'shop', 'amc', 'billing'].forEach(t => {
            const el = document.getElementById(`nav-${t}`);
            if (el) {
                if (t === currentTab) {
                    el.className = "flex flex-col items-center gap-0.5 text-amber-400 transition";
                } else {
                    el.className = "flex flex-col items-center gap-0.5 text-slate-400 hover:text-amber-400 transition";
                }
            }
        });
    }

    function handleSearch(val) {
        searchQuery = val.toLowerCase().trim();
        const clearBtn = document.getElementById('clearSearchBtn');
        if(searchQuery.length > 0) {
            clearBtn.classList.remove('hidden');
        } else {
            clearBtn.classList.add('hidden');
        }
        renderContent();
    }

    function clearSearch() {
        document.getElementById('globalSearch').value = '';
        searchQuery = '';
        document.getElementById('clearSearchBtn').classList.add('hidden');
        renderContent();
    }

    // Main Rendering Router
    function renderContent() {
        const main = document.getElementById('mainContent');
        main.innerHTML = '';

        if (currentTab === 'home') {
            main.innerHTML = renderHomeHTML();
        } else if (currentTab === 'services') {
            main.innerHTML = renderServicesHTML();
        } else if (currentTab === 'shop') {
            main.innerHTML = renderShopHTML();
        } else if (currentTab === 'amc') {
            main.innerHTML = renderAmcHTML();
        } else if (currentTab === 'billing') {
            main.innerHTML = renderBillingHTML();
        }
    }

    // --- 1. Home View ---
    function renderHomeHTML() {
        return `
                <!-- Hero Banner Card -->
                <div class="bg-gradient-to-br from-amber-500/20 via-slate-800 to-slate-900 border border-amber-500/40 rounded-2xl p-4 relative overflow-hidden shadow-lg">
                    <div class="absolute right-[-10px] bottom-[-10px] opacity-10 text-8xl">❄️</div>
                    <span class="bg-amber-500/20 text-amber-400 text-[10px] font-semibold px-2 py-0.5 rounded-full border border-amber-500/30">Verified & Trusted Experts</span>
                    <h2 class="text-lg font-bold text-slate-100 mt-2">श्री Hari Om Enterprises</h2>
                    <p class="text-xs text-slate-300 mt-1">Complete AC Maintenance, Buy/Sell, Rent, AMC & CCTV Surveillance Services.</p>
                    <div class="mt-4 flex gap-2">
                        <button onclick="openBookingModal()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-3 rounded-xl text-xs shadow transition flex items-center justify-center gap-1.5">
                            <span>⚡ Book AC Service</span>
                        </button>
                        <button onclick="switchTab('shop')" class="bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 font-semibold py-2 px-3 rounded-xl text-xs transition">
                            Buy / Rent AC
                        </button>
                    </div>
                </div>

                <!-- Quick Services Grid -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Our Core Services</h3>
                        <button onclick="switchTab('services')" class="text-xs text-amber-400 hover:underline">View All</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div onclick="openBookingModal('Jet Power AC Servicing')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3 rounded-xl cursor-pointer transition flex flex-col justify-between">
                            <span class="text-2xl">❄️</span>
                            <div class="mt-2">
                                <h4 class="text-xs font-bold text-slate-200">AC Servicing</h4>
                                <p class="text-[10px] text-slate-400">Starting ₹499</p>
                            </div>
                        </div>
                        <div onclick="openBookingModal('AC Repair & Gas Refill')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3 rounded-xl cursor-pointer transition flex flex-col justify-between">
                            <span class="text-2xl">⚡</span>
                            <div class="mt-2">
                                <h4 class="text-xs font-bold text-slate-200">Repair & Gas Top-Up</h4>
                                <p class="text-[10px] text-slate-400">Starting ₹399</p>
                            </div>
                        </div>
                        <div onclick="openBookingModal('Installation / Uninstallation')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3 rounded-xl cursor-pointer transition flex flex-col justify-between">
                            <span class="text-2xl">🛠️</span>
                            <div class="mt-2">
                                <h4 class="text-xs font-bold text-slate-200">Install / Unistall</h4>
                                <p class="text-[10px] text-slate-400">Professional setup</p>
                            </div>
                        </div>
                        <div onclick="openSellModal()" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3 rounded-xl cursor-pointer transition flex flex-col justify-between">
                            <span class="text-2xl">💰</span>
                            <div class="mt-2">
                                <h4 class="text-xs font-bold text-slate-200">Sell / Exchange AC</h4>
                                <p class="text-[10px] text-slate-400">Instant cash offer</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- CCTV Upcoming Feature Banner -->
                <div class="bg-gradient-to-r from-blue-950 via-slate-900 to-indigo-950 border border-blue-500/40 rounded-xl p-3.5 flex items-center justify-between shadow-md">
                    <div>
                        <span class="bg-blue-500/20 text-blue-400 text-[9px] font-bold px-2 py-0.5 rounded border border-blue-500/30">COMING SOON</span>
                        <h4 class="text-xs font-bold text-slate-100 mt-1">CCTV Camera Surveillance</h4>
                        <p class="text-[10px] text-slate-400">HD/4K Installation & AMC launching shortly.</p>
                    </div>
                    <button onclick="alert('CCTV Surveillance & Security Services are launching soon! Contact us for advance pre-booking.')" class="bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-semibold py-1.5 px-3 rounded-lg shadow transition">
                        Notify Me
                    </button>
                </div>

                <!-- Quick AMC Banner -->
                <div onclick="switchTab('amc')" class="bg-gradient-to-r from-amber-950/40 via-slate-900 to-slate-900 border border-amber-500/30 rounded-xl p-3.5 flex items-center justify-between cursor-pointer hover:border-amber-500 transition">
                    <div>
                        <span class="text-amber-400 text-[10px] font-bold">ANNUAL MAINTENANCE CONTRACT</span>
                        <h4 class="text-xs font-bold text-slate-100 mt-0.5">Secure Year-Round Cool Comfort</h4>
                        <p class="text-[10px] text-slate-400">Plans starting at ₹1,999/year with free breakdown visits.</p>
                    </div>
                    <span class="text-amber-400 font-bold text-sm">→</span>
                </div>
            `;
    }

    // --- 2. Services View ---
    function renderServicesHTML() {
        let filtered = servicesList.filter(s => s.title.toLowerCase().includes(searchQuery) || s.desc.toLowerCase().includes(searchQuery));
        return `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Professional AC Services</h3>
                    <span class="text-[10px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">Doorstep Service</span>
                </div>
                <div class="space-y-2.5">
                    ${filtered.length === 0 ? '<p class="text-xs text-slate-500 text-center py-6">No matching services found.</p>' : ''}
                    ${filtered.map(s => `
                        <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl p-3 flex items-start justify-between gap-3 shadow">
                            <div class="flex items-start gap-3">
                                <span class="text-2xl bg-slate-900 p-2 rounded-lg border border-slate-700 shrink-0">${s.icon}</span>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-100">${s.title}</h4>
                                    <p class="text-[10px] text-slate-400 mt-0.5 leading-relaxed">${s.desc}</p>
                                    <div class="mt-2 flex items-center gap-2">
                                        <span class="text-amber-400 text-xs font-bold">${s.price}</span>
                                    </div>
                                </div>
                            </div>
                            <button onclick="openBookingModal('${s.title}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-[11px] px-3 py-1.5 rounded-lg shadow shrink-0 transition">
                                Book Now
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
    }

    // --- 3. Shop & Rental View ---
    function renderShopHTML() {
        let filtered = shopInventory.filter(item => item.name.toLowerCase().includes(searchQuery) || item.desc.toLowerCase().includes(searchQuery));
        return `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">AC Buy, Sell & Rental Hub</h3>
                    <button onclick="openSellModal()" class="text-[10px] bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/30 font-semibold">Sell Your AC</button>
                </div>
                <div class="space-y-3">
                    ${filtered.length === 0 ? '<p class="text-xs text-slate-500 text-center py-6">No matching AC units found.</p>' : ''}
                    ${filtered.map(item => `
                        <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl p-3.5 shadow">
                            <div class="flex justify-between items-start">
                                <span class="text-[9px] font-bold px-2 py-0.5 rounded ${item.imageBadge === 'NEW' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-purple-500/20 text-purple-400 border border-purple-500/30'}">${item.imageBadge}</span>

                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-sm">✕</button>

    function openBillingModal(type) {
        const modal = document.getElementById('modalOverlay');
        const content = document.getElementById('modalContent');
        const isInv = type === 'invoice';
        content.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h3 class="text-sm font-bold text-amber-400">${isInv ? 'Create Post-Service Tax Invoice' : 'Create Pre-Service Quotation'}</h3>

                        <label class="block text-slate-400 mb-1">Customer Name</label>
                        <input type="text" id="billCust" required placeholder="Client full name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-slate-200">

    function closeModal() {
        document.getElementById('modalOverlay').classList.add('hidden');

    function submitBooking(e) {
        e.preventDefault();
        alert('🎉 Booking successfully registered with श्री Hari Om Enterprises! Our technician will call you within 15 minutes.');
        closeModal();
    }

    function submitSellInquiry(e) {
        e.preventDefault();
        alert('💰 Sell inquiry submitted! Our valuation expert will contact you shortly with the best quote.');
        closeModal();
    }

    function submitGenericInquiry(e) {
        e.preventDefault();
        alert('✅ Inquiry received successfully! श्री Hari Om Enterprises team will get in touch with you right away.');
        closeModal();
    }

    function generateBillDoc(e, type) {
        e.preventDefault();
        const name = document.getElementById('billCust').value;
        const desc = document.getElementById('billDesc').value;
        const amt = parseFloat(document.getElementById('billAmt').value);
        const useGst = document.getElementById('billGst').value === 'yes';

        const tax = useGst ? Math.round(amt * 0.18 * 100) / 100 : 0;
        const total = amt + tax;
        const docId = type === 'invoice' ? 'SHO-INV-' + Math.floor(1000 + Math.random() * 9000) : 'SHO-EST-' + Math.floor(1000 + Math.random() * 9000);

        const modalContent = document.getElementById('modalContent');
        modalContent.innerHTML = `
                <div class="bg-white text-slate-900 p-4 rounded-xl text-xs space-y-3">
                    <div class="text-center border-b pb-2">
                        <h2 class="font-bold text-sm text-amber-600">श्री Hari Om Enterprises</h2>
                        <p class="text-[9px] text-slate-600">AC Maintenance, Repair, Buy/Sell, Rent & AMC</p>
                        <p class="text-[9px] font-semibold text-slate-800 mt-1">${type.toUpperCase()}: #${docId}</p>
                    </div>
                    <div class="flex justify-between text-[10px] text-slate-700">
                        <div><strong>Customer:</strong> ${name}</div>
                        <div><strong>Date:</strong> ${new Date().toLocaleDateString()}</div>
                    </div>
                    <div class="border-t border-b py-2 space-y-1">
                        <div class="flex justify-between font-semibold">
                            <span>Description</span>
                            <span>Amount</span>
                        </div>
                        <div class="flex justify-between text-slate-600">
                            <span>${desc}</span>
                            <span>₹${amt.toFixed(2)}</span>
                        </div>
                        ${useGst ? `<div class="flex justify-between text-slate-600 text-[10px]"><span>GST (18%)</span><span>₹${tax.toFixed(2)}</span></div>` : ''}
                    </div>
                    <div class="flex justify-between font-bold text-sm pt-1">
                        <span>Total Payable:</span>
                        <span class="text-emerald-600">₹${total.toFixed(2)}</span>
                    </div>
                    <div class="text-center pt-2 border-t text-[9px] text-slate-500">
                        <p>Thank you for choosing श्री Hari Om Enterprises!</p>
                        <p>Contact: +91 7710817224</p>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="window.print()" class="flex-1 bg-slate-900 text-white py-1.5 rounded font-medium">Print / Save PDF</button>
                        <button onclick="closeModal()" class="bg-slate-200 text-slate-800 py-1.5 px-3 rounded font-medium">Close</button>
                    </div>
                </div>
            `;
    }
